<title>🌈 彩虹成长工作台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#fef9e7 0%,#fdebd0 50%,#fadbd8 100%);min-height:100vh;color:#3e2723;padding-bottom:60px}
.header{text-align:center;padding:20px 16px 8px}
.header h1{font-size:22px;background:linear-gradient(135deg,#e67e22,#e74c3c,#8e44ad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header .date{font-size:13px;color:#b9770e;margin-top:4px}
.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 10px;max-width:600px;margin:0 auto}
.card{background:rgba(255,255,255,.88);border-radius:14px;padding:14px;box-shadow:0 2px 12px rgba(0,0,0,.05)}
.card.full{grid-column:1/-1}
.card h3{font-size:13px;color:#b9770e;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.card h3 .btns{display:flex;gap:4px}
.card h3 .btn{font-size:13px;padding:2px 8px;border-radius:10px;border:none;cursor:pointer;font-weight:500}
.btn-add{background:#d1fae5;color:#065f46}
.btn-edit{background:#fef3c7;color:#b45309}
.btn-del{background:#fee2e2;color:#991b1b}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #fef3c7;font-size:13px}
.stat-row:last-child{border-bottom:none}
.stat-val{font-weight:600;color:#e67e22;text-align:right;max-width:60%}
.tag{display:inline-block;background:#fef3c7;color:#b45309;padding:2px 8px;border-radius:10px;font-size:11px;margin:2px 3px 2px 0}
.tag.green{background:#d1fae5;color:#065f46}
.tag.blue{background:#dbeafe;color:#1e40af}
.tag.purple{background:#ede9fe;color:#5b21b6}
.tag.pink{background:#fce7f3;color:#9d174d}
.milestone{background:linear-gradient(135deg,#fef3c7,#fde68a);border:1px solid #fbbf24;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:13px}
.milestone .ms-date{font-size:11px;color:#b45309}
.sleep-bars{display:flex;gap:6px;align-items:flex-end;height:60px;overflow-x:auto}
.sleep-bar{flex:0 0 50px;background:linear-gradient(180deg,#a29bfe,#6c5ce7);border-radius:6px 6px 2px 2px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px;font-size:9px;color:#fff;min-height:12px}
.sleep-labels{display:flex;gap:6px;margin-top:2px}
.sleep-labels .sleep-label{flex:0 0 50px;font-size:9px;color:#7f8c8d;text-align:center}
.empty{color:#ccc;font-size:12px;text-align:center;padding:12px}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:100;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;padding:20px;width:90%;max-width:400px;max-height:80vh;overflow-y:auto}

// ========== 数据管理 ==========
const DATA_URL='https://yukiwang1993.github.io/rainbow-workbench/rainbow_data.json?v=202609032108';
let data=null;
async function loadData(){
  var local=JSON.parse(localStorage.getItem('rainbow_wb')||'null');
  try{
    var resp=await fetch(DATA_URL+'&t='+Date.now());
    if(resp.ok){data=await resp.json();localStorage.setItem('rainbow_wb',JSON.stringify(data));return;}
  }catch(e){}
  if(local){data=local;}else{data=JSON.parse(JSON.stringify(DEFAULT));save();}
}
function save(){localStorage.setItem('rainbow_wb',JSON.stringify(data));}
function ensureFields(){
  if(!data.growth){data.growth=JSON.parse(JSON.stringify(DEFAULT.growth));save();}
  if(!data.words){data.words=JSON.parse(JSON.stringify(DEFAULT.words));save();}
  if(data.words&&data.words.length&&!data.words[0].hasOwnProperty('status')){data.words.forEach(function(w){w.status=w.status||'learning';});save();}
  if(!data.dailyNotes){data.dailyNotes=JSON.parse(JSON.stringify(DEFAULT.dailyNotes));save();}
  if(!data.dailyBriefs){data.dailyBriefs=JSON.parse(JSON.stringify(DEFAULT.dailyBriefs));save();}
  if(!data.weeklyReports){data.weeklyReports=JSON.parse(JSON.stringify(DEFAULT.weeklyReports));save();}
  if(!data.monthlyReports){data.monthlyReports=JSON.parse(JSON.stringify(DEFAULT.monthlyReports));save();}
}
function resetAll(){if(confirm('确定要重置所有数据为默认值吗？')){data=JSON.parse(JSON.stringify(DEFAULT));save();render();}}

// ========== Modal ==========
function showModal(title,fields,onSave){
  var m=document.getElementById('modalBody');
  var h='<h4>'+title+'</h4>';
  fields.forEach(function(f){
    h+='<label>'+f.label+'</label>';
    if(f.type==='textarea')h+='<textarea id="mf_'+f.key+'" rows="2">'+esc(f.value||'')+'</textarea>';
    else if(f.type==='select'){h+='<select id="mf_'+f.key+'">';f.options.forEach(function(o){h+='<option value="'+esc(o)+'"'+(o===f.value?' selected':'')+'>'+o+'</option>'});h+='</select>';}
    else h+='<input id="mf_'+f.key+'" value="'+esc(f.value||'')+'">';
  });
  h+='<div class="actions"><button class="btn-cancel" onclick="closeModal()">取消</button><button class="btn-save" onclick="saveModal()">保存</button></div>';
  m.innerHTML=h;
  m._onSave=onSave;
  document.getElementById('modal').classList.add('show');
}
window._modalOnSave=null;
function closeModal(){document.getElementById('modal').classList.remove('show');}
function saveModal(){
  var m=document.getElementById('modalBody');
  var fields=document.getElementById('modalBody').querySelectorAll('[id^="mf_"]');
  var vals={};
  fields.forEach(function(f){vals[f.id.replace('mf_','')]=f.value});
  if(m._onSave){m._onSave(vals);}
  closeModal();save();render();toast('已保存 ✅');
}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ========== 辅助 ==========
function avgSleep(){
  var t=0;data.sleep.forEach(function(s){var m=calcSleepTotal(s).match(/(\d+)h(\d+)m/);if(m)t+=parseInt(m[1])*60+parseInt(m[2])});
  if(!data.sleep.length)return'--';
  var avg=t/data.sleep.length;
  return Math.floor(avg/60)+'h'+Math.round(avg%60)+'m';
}
function isRecent(ds,days){var d=new Date(ds);var n=new Date();return(n-d)/86400000<=days;}
function isThisWeek(ds){var d=new Date(ds+'T00:00:00+08:00');var n=new Date();var day=n.getDay();var monday=new Date(n);monday.setDate(n.getDate()-(day===0?6:day-1));monday.setHours(0,0,0,0);return d>=monday;}

function calcSleepTotal(s){
  if(s.total && s.total!=='')return s.total;
  if(!s.sleep||!s.wake)return'--';
  var sl=s.sleep.split(':'),wk=s.wake.split(':');
  var sleepM=parseInt(sl[0])*60+parseInt(sl[1]);
  var wakeM=parseInt(wk[0])*60+parseInt(wk[1]);
  if(wakeM<sleepM)wakeM+=24*60;
  var totalM=wakeM-sleepM;
  return Math.floor(totalM/60)+'h'+Math.round(totalM%60)+'m';
}
function todayStr(){return new Date().toISOString().substring(0,10);}

// ========== 生长曲线 ==========
// 卫健委2022 男童生长标准 (P50参考值)
function getStdHeight(ageMonth){var k=[24,27,30,33,36,39];var v=[88.2,90.8,93.2,95.4,97.5,99.5];if(ageMonth<=k[0])return v[0];if(ageMonth>=k[5])return v[5];for(var i=0;i<k.length-1;i++){if(ageMonth>=k[i]&&ageMonth<k[i+1]){return v[i]+(v[i+1]-v[i])*(ageMonth-k[i])/(k[i+1]-k[i]);}}return v[0];}
function getStdWeight(ageMonth){var k=[24,27,30,33,36,39];var v=[12.5,13.1,13.6,14.1,14.6,15.1];if(ageMonth<=k[0])return v[0];if(ageMonth>=k[5])return v[5];for(var i=0;i<k.length-1;i++){if(ageMonth>=k[i]&&ageMonth<k[i+1]){return v[i]+(v[i+1]-v[i])*(ageMonth-k[i])/(k[i+1]-k[i]);}}return v[0];}
function getAgeMonth(birth,dateStr){var b=new Date(birth);var d=new Date(dateStr);return (d.getFullYear()-b.getFullYear())*12+(d.getMonth()-b.getMonth());}

function renderGrowthChart(){
  var g = data.growth;
  if(!g || !g.length) return;
  var birth = data.profile.birth;
  // 只取最近6个月
  var sixMonthsAgo = new Date();
  sixMonthsAgo.setMonth(sixMonthsAgo.getMonth()-6);
  var cutoff = sixMonthsAgo.toISOString().substring(0,7);
  g = g.filter(function(x){return x.date>=cutoff;});
  if(!g.length) return;
  var months = g.map(function(x){var d=new Date(x.date);return d.getFullYear()+'.'+(d.getMonth()+1);});
  var heights = g.map(function(x){return x.height;});
  var weights = g.map(function(x){return x.weight;});
  var stdH = g.map(function(x){return getStdHeight(getAgeMonth(birth,x.date));});
  var stdW = g.map(function(x){return getStdWeight(getAgeMonth(birth,x.date));});

  var domH = document.getElementById('growthChartH');
  if(domH){
    var chH = echarts.init(domH);
    chH.setOption({
      tooltip:{trigger:'axis'},
      grid:{left:'10%',right:'8%',top:15,bottom:25,containLabel:false},
      xAxis:{type:'category',data:months,axisLabel:{color:'#999',fontSize:10,rotate:45},axisTick:{show:false},axisLine:{lineStyle:{color:'#ddd'}}},
      yAxis:{type:'value',name:'cm',min:function(v){return v.min-3;},max:function(v){return v.max+3;},splitLine:{lineStyle:{color:'#f0f0f0'}},axisLabel:{color:'#999',fontSize:9},nameTextStyle:{color:'#999',fontSize:9}},
      series:[
        {name:'P50标准',type:'line',data:stdH,lineStyle:{color:'#bbb',type:'dashed',width:1},symbol:'none',silent:true},
        {name:'彩虹身高',type:'line',data:heights,lineStyle:{color:'#ff6b8a',width:2.5},symbol:'circle',symbolSize:6,itemStyle:{color:'#ff6b8a',borderColor:'#fff',borderWidth:2},areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(255,107,138,0.2)'},{offset:1,color:'rgba(255,107,138,0.02)'}]}}}
      ]
    });
    window.addEventListener('resize',function(){chH.resize();});
  }

  var domW = document.getElementById('growthChartW');
  if(domW){
    var chW = echarts.init(domW);
    chW.setOption({
      tooltip:{trigger:'axis'},
      grid:{left:'10%',right:'8%',top:15,bottom:25,containLabel:false},
      xAxis:{type:'category',data:months,axisLabel:{color:'#999',fontSize:10,rotate:45},axisTick:{show:false},axisLine:{lineStyle:{color:'#ddd'}}},
      yAxis:{type:'value',name:'kg',min:function(v){return v.min-1;},max:function(v){return v.max+1;},splitLine:{lineStyle:{color:'#f0f0f0'}},axisLabel:{color:'#999',fontSize:9},nameTextStyle:{color:'#999',fontSize:9}},
      series:[
        {name:'P50标准',type:'line',data:stdW,lineStyle:{color:'#bbb',type:'dashed',width:1},symbol:'none',silent:true},
        {name:'彩虹体重',type:'line',data:weights,lineStyle:{color:'#5b9bd5',width:2.5},symbol:'circle',symbolSize:6,itemStyle:{color:'#5b9bd5',borderColor:'#fff',borderWidth:2},areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(91,155,213,0.2)'},{offset:1,color:'rgba(91,155,213,0.02)'}]}}}
      ]
    });
    window.addEventListener('resize',function(){chW.resize();});
  }
}

function render(){
  var d=data;

// ========== 简报/小纸条获取与渲染 ==========
function renderMarkdown(md){
  if(!md)return'';
  var h=md;
  // 粗体
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  // 水平线
  h=h.replace(/^---$/gm,'<hr style="border:none;border-top:1px dashed #ddd;margin:8px 0">');
  // 列表项
  h=h.replace(/^- (.+)$/gm,'<li style="margin-left:12px;line-height:1.7">$1</li>');
  // 包裹连续列表
  h=h.replace(/(<li[^>]*>.*?<\/li>\s*)+/g,'<ul style="list-style:none;padding:0;margin:4px 0">$&</ul>');
  // 换行：仅段落间空行转<br>，单换行保留自然流排
  h=h.replace(/\n{2,}/g,'<br>');
  return h;
}

async function fetchBriefing(){
  try{
    var r=await fetch('latest_briefing.md');
    if(!r.ok)return;
    var md=await r.text();
    if(!md||md.trim().length<10)return;
    var el=document.getElementById('briefingCard');
    var content=document.getElementById('briefingContent');
    if(!el||!content)return;
    content.innerHTML=renderMarkdown(md);
    content.style.display='';
    el.style.display='';
    var btn=document.getElementById('briefingBtn');
    if(btn)btn.textContent='收起 ▾';
  }catch(e){}
}

async function fetchNote(){
  try{
    var r=await fetch('latest_note.md');
    if(!r.ok)return;
    var md=await r.text();
    if(!md||md.trim().length<10)return;

function toggleBriefing(){
  var content=document.getElementById('briefingContent');
  var btn=document.getElementById('briefingBtn');
  if(content.style.display==='none'){
    content.style.display='';
    btn.textContent='收起 ▾';
  }else{
    content.style.display='none';
    btn.textContent='展开 ▸';
  }
}

    {key:'status',label:'状态',value:t.status,type:'select',options:['','🔥','📦','🆕']}
  ],function(v){data.toys[i]=v;});
}
function editSkills(){
  var h='<h4>编辑能力面板</h4>';
  data.skills.forEach(function(s,i){
    h+='<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee">';
    h+='<span>'+esc(s.name)+'</span>';
    h+='<button style="padding:4px 12px;border-radius:8px;border:none;cursor:pointer;'+(s.ok?'background:#d1fae5;color:#065f46':'background:#fce7f3;color:#9d174d')+'" onclick="toggleSkill('+i+')">'+(s.ok?'✅ 已掌握':'🔄 进行中')+'</button>';
    h+='</div>';
  });
  h+='<div class="actions"><button class="btn-cancel" onclick="closeModal()">关闭</button></div>';
  var m=document.getElementById('modalBody');m.innerHTML=h;
  document.getElementById('modal').classList.add('show');
}
function toggleSkill(i){data.skills[i].ok=!data.skills[i].ok;save();editSkills();render();}

// ========== 单词编辑 ==========
function addWord(){
  showModal('新增单词',[
    {key:'date',label:'日期',value:'2026-08-06'},
    {key:'word',label:'单词',value:''}
  ],function(v){
    if(!data.words)data.words=[];
    v.status='learning';
    data.words.push(v);
    data.words.sort(function(a,b){return a.date>b.date?1:-1;});
  });
}
function toggleWord(i){
  if(!data.words||!data.words[i])return;
  var was = data.words[i].status;
  data.words[i].status = was==='mastered'?'learning':'mastered';
  // 自动里程碑：掌握数达50/100/150...时
  if(data.words[i].status==='mastered'){
    var mCount = data.words.filter(function(w){return w.status==='mastered';}).length;
    if(mCount>0 && mCount%50===0){
      var mt = '🎉 单词本已掌握'+mCount+'个单词！';
      if(!data.milestones.some(function(m){return m.text===mt;})){
        data.milestones.push({date:new Date().toISOString().substring(0,10),text:mt});
      }
    }
  }
  save();render();
}
function editWords(){
  var h='<h4>编辑单词本</h4>';
  if(!data.words||!data.words.length){h+='<div style="color:#999;padding:10px">暂无单词</div>';}
  else{
    data.words.forEach(function(w,i){
      h+='<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee">';
      h+='<span>'+esc(w.word)+' <span style="font-size:11px;color:#aaa">'+w.date+'</span></span>';
      h+='<div style="display:flex;gap:6px">';
      h+='<button style="padding:4px 10px;border-radius:8px;border:none;cursor:pointer;'+(w.status==='mastered'?'background:#d1fae5;color:#065f46':'background:#fce7f3;color:#9d174d')+'" onclick="toggleWord('+i+');editWords();">'+(w.status==='mastered'?'✅ 已学会':'🔄 学习中')+'</button>';
      h+='<button style="padding:4px 8px;border-radius:8px;border:none;background:#fee2e2;color:#dc2626;cursor:pointer;font-size:11px" onclick="if(confirm(\'删除 '+esc(w.word)+'？\')){data.words.splice('+i+',1);save();render();closeModal();}">✕</button>';
      h+='</div></div>';
    });
  }
  h+='<div class="actions"><button class="btn-cancel" onclick="closeModal()">关闭</button></div>';
  var m=document.getElementById('modalBody');m.innerHTML=h;
  document.getElementById('modal').classList.add('show');
}

// ========== 启动 ==========
loadData().then(function(){ensureFields();render();});
</script>
